# Local infrastructure.
#   docker compose up -d                      -> Postgres + Redis (for `pnpm dev`)
#   docker compose --profile app up -d --build -> full stack incl. API + 3 worker replicas
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codesync
      POSTGRES_PASSWORD: codesync
      POSTGRES_DB: codesync
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U codesync']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://codesync:codesync@postgres:5432/codesync
      REDIS_URL: redis://redis:6379
      # Overridable from the shell, e.g. for load tests that sign up many users from one IP.
      AUTH_RATE_LIMIT_PER_MIN: ${AUTH_RATE_LIMIT_PER_MIN:-5}
      RUN_RATE_LIMIT_PER_MIN: ${RUN_RATE_LIMIT_PER_MIN:-10}
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://codesync:codesync@postgres:5432/codesync
      REDIS_URL: redis://redis:6379
    # The worker talks to the host Docker daemon to spawn sandbox containers.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      replicas: 3
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
